<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <title>Service Recovery</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 34%),
          linear-gradient(180deg, #020617 0%, #0f172a 48%, #131c30 100%);
        color: #eff6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(720px, 100%);
        padding: 32px;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      .eyebrow {
        display: inline-flex;
        margin-bottom: 14px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.14);
        color: #7dd3fc;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.8rem);
        line-height: 0.95;
      }

      p {
        margin: 14px 0 0;
        color: #cbd5e1;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 14px;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .primary {
        border: 0;
        background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        color: #fff;
      }

      .secondary {
        border: 1px solid rgba(96, 165, 250, 0.3);
        background: rgba(15, 23, 42, 0.72);
        color: #dbeafe;
      }

      .ghost {
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: transparent;
        color: #cbd5e1;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 28px;
      }

      .meta div {
        padding: 16px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.68);
        border: 1px solid rgba(148, 163, 184, 0.16);
      }

      dt {
        color: #7dd3fc;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      dd {
        margin: 10px 0 0;
        color: #eff6ff;
        word-break: break-word;
      }

      @media (max-width: 700px) {
        .card {
          padding: 24px;
          border-radius: 22px;
        }

        .meta {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <span class="eyebrow" id="appName">Service</span>
        <h1 id="title">Trying to recover your session</h1>
        <p id="message">We are checking the latest route for this app.</p>
        <p id="detail">If the main app is temporarily unavailable, we can send you to the backup site.</p>

        <div class="actions">
          <a class="primary" id="primaryLink" href="/">Open primary site</a>
          <a class="secondary" id="backupLink" href="/">Open backup site</a>
          <button class="ghost" id="retryButton" type="button">Try again</button>
        </div>

        <dl class="meta">
          <div>
            <dt>Reason</dt>
            <dd id="reasonValue">Unknown</dd>
          </div>
          <div>
            <dt>Primary</dt>
            <dd id="primaryValue">Not configured</dd>
          </div>
          <div>
            <dt>Backup</dt>
            <dd id="backupValue">Not configured</dd>
          </div>
        </dl>
      </section>
    </main>

    <script src="offline.js"></script>
  </body>
</html>
