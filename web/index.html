  <script>
    (function () {
      async function reportPwaClientState() {
        if (!("serviceWorker" in navigator)) {
          return;
        }

        const isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;

        let isInstalled = isStandalone;
        const manifestUrl = new URL("manifest.json", window.location.href).href;

        try {
          if (navigator.getInstalledRelatedApps) {
            const relatedApps = await navigator.getInstalledRelatedApps();
            isInstalled =
              isInstalled ||
              relatedApps.some(function (app) {
                return app.platform === "webapp" && app.url === manifestUrl;
              });
          }
        } catch (_) {}

        const registrations = await navigator.serviceWorker.getRegistrations().catch(function () {
          return [];
        });

        registrations.forEach(function (registration) {
          [registration.active, registration.waiting, registration.installing]
            .filter(Boolean)
            .forEach(function (worker) {
              worker.postMessage({
                type: "PWA_CLIENT_STATE",
                isInstalled: isInstalled,
                isStandalone: isStandalone,
              });
            });
        });
      }

      window.addEventListener("load", function () {
        reportPwaClientState().catch(function () {});
      });

      window.addEventListener("appinstalled", function () {
        reportPwaClientState().catch(function () {});
      });
    })();
  </script>

  <script>
    (function () {
      const maxTouchPoints = Number(navigator.maxTouchPoints || 0);
      const screenWidth = Number(window.screen && window.screen.width || 0);
      const screenHeight = Number(window.screen && window.screen.height || 0);
      const innerWidth = Number(window.innerWidth || 0);
      const shortSide = Math.min(screenWidth || innerWidth, screenHeight || innerWidth);
      const looksPhoneSizedScreen = shortSide > 0 && shortSide <= 500;
      const desktopSizedViewport = shortSide > 0 && innerWidth >= shortSide * 1.35;
      const isDesktopSiteOnPhone = maxTouchPoints > 0 &&
        looksPhoneSizedScreen &&
        desktopSizedViewport;

      if (!isDesktopSiteOnPhone) {
        document.write('<meta id="app-viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">');
        return;
      }

      const forcedWidth = Math.round(shortSide);
      const forcedScale = shortSide > 0 && innerWidth > 0
        ? (shortSide / innerWidth)
        : 1;
      document.write(
        '<meta id="app-viewport" name="viewport" content="width=' +
          forcedWidth +
          ', initial-scale=' +
          forcedScale +
          ', minimum-scale=' +
          forcedScale +
          ', maximum-scale=' +
          forcedScale +
          ', viewport-fit=cover, interactive-widget=resizes-content">'
      );
      document.documentElement.setAttribute("data-phone-desktop-site", "true");
    })();
  </script>

  <script>
    (function () {
      var APP_VERSION = "1.0.46+66";
      var VERSION_STORAGE_KEY = "ppc-toda-app-version";
      var VERSION_CHECK_DELAY_MS = 10000;
      var bootstrapLoaded = false;

      function latestVersionTag(versionJson) {
        if (!versionJson || !versionJson.version || !versionJson.build_number) {
          return null;
        }

        return versionJson.version + "+" + versionJson.build_number;
      }

      function deleteAppCaches() {
        if (!("caches" in window)) {
          return Promise.resolve();
        }

        return caches.keys().then(function (keys) {
          return Promise.all(
            keys.map(function (key) {
              return caches.delete(key);
            })
          );
        });
      }

      function loadFlutterBootstrap(versionTag) {
        if (bootstrapLoaded) {
          return;
        }

        bootstrapLoaded = true;
        var script = document.createElement("script");
        script.src = "flutter_bootstrap.js?v=" + encodeURIComponent(versionTag);
        script.async = true;
        document.body.appendChild(script);
      }

      function registerAppServiceWorker(versionTag) {
        if (!("serviceWorker" in navigator)) {
          return;
        }

        navigator.serviceWorker.register("/sw.js?v=" + encodeURIComponent(versionTag))
          .then(function () {})
          .catch(function () {});
      }

      function checkForVersionUpdate() {
        var controller = window.AbortController ? new AbortController() : null;
        var timeoutId = window.setTimeout(function () {
          if (controller) {
            controller.abort();
          }
        }, 1200);

        return fetch("version.json?v=" + encodeURIComponent(Date.now().toString()), {
          cache: "no-store",
          signal: controller ? controller.signal : undefined,
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Version request failed");
            }

            return response.json();
          })
          .then(function (versionJson) {
            return latestVersionTag(versionJson) || APP_VERSION;
          })
          .catch(function () {
            return APP_VERSION;
          })
          .then(function (versionTag) {
            window.clearTimeout(timeoutId);
            return versionTag;
          });
      }

      window.addEventListener("load", function () {
        registerAppServiceWorker(APP_VERSION);
        loadFlutterBootstrap(APP_VERSION);

        window.setTimeout(function () {
          checkForVersionUpdate().then(function (versionTag) {
            try {
              localStorage.setItem(VERSION_STORAGE_KEY, versionTag);
            } catch (_) {}

            if (versionTag !== APP_VERSION) {
              deleteAppCaches().catch(function () {});
              registerAppServiceWorker(versionTag);
            }
          });
        }, VERSION_CHECK_DELAY_MS);
      });
    })();

    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("app-startup-splash");
      if (splash) {
        splash.style.display = "none";
      }
    });
  </script>
